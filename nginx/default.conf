upstream django_app {
    # Указываем имя контейнера Django и его внутренний порт Gunicorn
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Ограничение на максимальный размер загружаемых файлов (аватарки и т.д.)
    client_max_body_size 10M;

    # Проксирование всех запросов к API на Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Раздача статических файлов Django (подключим через volume)
    location /static/ {
        alias /app/static/;
    }

    # Раздача медиа-файлов пользователей
    location /media/ {
        alias /app/media/;
    }
}
