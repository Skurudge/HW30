version: '3.8'

services:
  # 1. Изолированная база данных PostgreSQL (Критерий оценки)
  db:
    image: postgres:16-alpine
    container_name: lms_postgres_db
    env_file:
      - .env  # Подключение переменных окружения (Критерий оценки)
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Сохранность данных БД
    expose:
      - "5432"  # Закрыто снаружи, доступно только внутри сети Docker (Критерий оценки)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Изолированный брокер сообщений Redis (Критерий оценки)
  redis:
    image: redis:7-alpine
    container_name: lms_redis_broker
    volumes:
      - redis_data:/data  # Сохранность данных Redis (Критерий оценки)
    expose:
      - "6379"  # Закрыто снаружи, доступно только внутри сети Docker (Критерий оценки)

  # 3. Основной веб-сервер Django (Критерий оценки)
  web:
    build: .
    container_name: lms_web_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"  # Открыт порт для доступа к API из браузера и Postman
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Асинхронный воркер Celery (Критерий оценки)
  celery_worker:
    build: .
    container_name: lms_celery_worker
    command: celery -A config.celery:app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 5. Планировщик Celery Beat (Критерий оценки)
  celery_beat:
    build: .
    container_name: lms_celery_beat
    command: celery -A config.celery:app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:  # Инициализация тома для Redis
